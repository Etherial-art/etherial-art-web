# Instalación (una sola vez por clon):
#   npm ci                  # instala ESLint y Prettier en node_modules/
#   pip install pre-commit  # o: pipx install pre-commit
#   pre-commit install
# Correr sobre todo el repo:  pre-commit run --all-files
# Ver docs/CODING_STANDARDS.md.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Las imágenes del portafolio pesan hasta ~800 KB; optimízalas antes de subir.
        args: [--maxkb=1024]
      - id: detect-private-key

  # ESLint y Prettier se ejecutan desde node_modules/ (npm ci) para usar
  # exactamente las versiones fijadas en package-lock.json, igual que en local.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        types_or: [html, css, javascript, json, markdown, yaml]
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --fix
        language: system
        files: \.(html|js|mjs)$
