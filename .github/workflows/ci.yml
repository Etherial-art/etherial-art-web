# Corre en cada PR (y en main) los mismos chequeos que el hook local.
# Ver docs/CODING_STANDARDS.md. Este repo no tiene código Python, así que no
# hay job de pytest (las pruebas del backend viven en niko-studio).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para comparar contra la rama base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # En PRs revisa solo los archivos que cambia el PR (igual que el hook de
      # commit); en main revisa todo el repo.
      - name: Run pre-commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --show-diff-on-failure --color=always \
              --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            pre-commit run --show-diff-on-failure --color=always --all-files
          fi
